name: Tauri PC Build

on:
  push:
    branches: [pc_version]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # tauri-action автоматически создаст/обновит релиз и прикрепит к нему билды
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: v__VERSION__          # Берёт версию из package.json / Cargo.toml
          releaseName: "Desktop App v__VERSION__"
          releaseBody: "Автоматическая сборка. Файлы для Windows и macOS прикреплены ниже."
          releaseDraft: true             # true = черновик (безопасно для параллельных jobs)
          retryAttempts: 3               # Защита от race condition при одновременном обновлении релиза