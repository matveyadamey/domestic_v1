name: Tauri PC Build

on:
  push:
    branches: [pc_version]
  workflow_dispatch:
    inputs:
      target:
        description: Which desktop target to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - all

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true

  # Push → Windows only. Manual run → choice (windows / macos / all).
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          win='{"platform":"windows-latest","args":"--bundles nsis","artifactName":"domestic-windows"}'
          mac='{"platform":"macos-latest","args":"--bundles dmg","artifactName":"domestic-macos"}'
          if [ "$EVENT" = "push" ] || [ "$TARGET" = "windows" ]; then
            echo "include=[$win]" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "macos" ]; then
            echo "include=[$mac]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$win,$mac]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Tauri (${{ matrix.artifactName }})
    needs: [test, matrix]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'
          # Save cache even if the build step fails
          save-if: true

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # Trim CR/LF from GitHub Secrets; use a real OS path (bash MSYS paths break on Windows).
      - name: Prepare updater signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAW_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is missing"
          }
          $key = ($env:RAW_KEY -replace "[\r\n]", "").Trim()
          $path = Join-Path $env:RUNNER_TEMP "tauri.key"
          [System.IO.File]::WriteAllText($path, $key)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PATH=$path"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY<<__TAURI_KEY__"
          Add-Content -Path $env:GITHUB_ENV -Value $key
          Add-Content -Path $env:GITHUB_ENV -Value "__TAURI_KEY__"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Key was generated without a password — do NOT set
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD (even empty breaks signing).
        with:
          includeDebug: false
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: Domestic_v1 v__VERSION__
          releaseBody: |
            Desktop build with auto-updater.
            Install once; later versions install automatically on launch.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
