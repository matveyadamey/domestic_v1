name: Tauri PC Build

on:
  push:
    branches: [pc_version]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true

  build:
    name: Tauri (${{ matrix.artifactName }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            artifactName: domestic-windows
          - platform: macos-latest
            args: --bundles dmg
            artifactName: domestic-macos
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # GitHub Secrets often append a trailing newline; Tauri treats the value as
      # raw base64 and fails with "Invalid symbol 10" if CR/LF are present.
      - name: Prepare updater signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is missing" >&2
            exit 1
          fi
          KEY="$(printf '%s' "$RAW_KEY" | tr -d '\r\n')"
          printf '%s' "$KEY" > "${RUNNER_TEMP}/tauri.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=${RUNNER_TEMP}/tauri.key" >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeDebug: false
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: Domestic_v1 v__VERSION__
          releaseBody: |
            Desktop build with auto-updater.
            Install once; later versions install automatically on launch.
          releaseDraft: false
          prerelease: false
          uploadReleaseAssets: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
